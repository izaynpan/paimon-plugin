enabled: true

# 开启后仅允许 groups 中的群；空列表禁止所有群，私聊不受影响。
groupWhitelist:
  enabled: false
  groups: []

trigger:
  nicknames: [派蒙, 派大王]
  stripTriggerName: false # 发给api时是否去除nicknames
  privateTrigger: true
  groupMentionTrigger: true
  groupNicknameTrigger: true
  ignoreBotSelf: true
  ignoreCommandPrefixes: ["#", "＃", "*", "%"]

conversation:
  # 群聊中由同一次模型请求判断是否需要回复；关闭时保持原行为，私聊不受影响。
  selectiveGroupReply: false
  # 真正询问无人接话时，至多补一句；独立于主动沉默与长期记忆。
  unansweredFollowUp:
    enabled: false
    waitMs: 30000
    cooldownMs: 180000
  # 开启后称呼优先取群名片，其次 QQ 昵称，再缺失用“旅行者”；关闭则默认称呼“旅行者”。
  useUserNickname: true
  debounceMs: 3000
  activeWindowMs: 90000
  collectAllNonCommandInActiveGroupSession: true
  collectPrivateFollowupWithoutTrigger: true
  maxContextBatches: 6
  # 点名/@ 时按需查同群同用户的协议历史，不持续缓存未触发消息。
  preTrigger:
    enabled: true
    windowMs: 30000
    maxMessages: 3
    historyPageSize: 20
    historyMaxPages: 3
    historyTimeoutMs: 1500

deepseek:
  apiKey: ""
  apiKeyEnv: DEEPSEEK_API_KEY
  baseUrl: https://api.deepseek.com
  model: deepseek-flash
  timeoutMs: 60000
  maxTokens: 1200
  temperature: 0.8
  maxRetries: 1
  retryDelayMs: 800
  thinking: { type: disabled }
  stream: false

logging:
  enabled: true
  file: data/logs/deepseek.jsonl
  includePrompt: true
  includeResponse: true
  includeUsage: true
  maxBytes: 5242880
  maxFiles: 3

memory:
  enabled: true
  updateMode: session_end_evaluate
  evaluationModel: deepseek-flash
  evaluationMaxTokens: 1600
  evaluationTemperature: 0.2
  userMemoryEnabled: true
  maxParticipantMemoriesForPrompt: 8
  maxMemoryCharsForPrompt: 2500
  maxSessionMessagesForEvaluation: 100
  maxSessionCharsForEvaluation: 12000
  maxStoredMemoryChars: 8000

runtime:
  persistActiveSessions: false
  saveFailedMemoryEvaluations: true
  maxFailedMemoryEvaluationFiles: 20

reply:
  split: true
  guideDelayScale: 0.5 # 攻略问答的首条/分段等待目标倍率；0.1～1，1 恢复普通节奏。
  minDelayMs: 4000
  maxDelayMs: 24000
  baseDelayMs: 1200
  typingMsPerChar: 340
  readingMsPerChar: 360
  delayJitter: 0.1
  # 首条及跨轮消息统一限速；旧 maxTotalDelayMs 已忽略，不再压缩间隔。
  minSegmentLength: 6
  maxSegmentLength: 180
  keepCodeBlockTogether: true
  sendRetries: 1

persona: { file: persona.md }

stickers:
  enabled: true
  configFile: stickers.yaml
  probability: 0.12
  sendAfterText: true

knowledge: { enabled: false, provider: none }

# 自动联网：知识库优先，仅为缺失或过时的提瓦特资料搜索。代码更新需重启。
webSearch:
  enabled: false
  apiKey: "" # 搜索/抓取专用 Key；留空沿用 deepseek.apiKey（含聊天环境变量解析结果）。
  maxSearches: 2
  maxFetches: 3
  timeoutMs: 15000
  dailyRequestLimit: 200
  cacheTtlMs: 3600000
  maxContextChars: 12000
  includeSources: false
