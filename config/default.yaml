enabled: true

# 独立于聊天开关/白名单/Key，复用本人扫码登录凭证；仅国服星铁更新入口。
srGacha:
  enabled: true
  cooldownMs: 300000 # 同一用户跨群/机器人共用；最少30秒，更新过程中禁止重复执行

# 独立于聊天总开关、聊天白名单和 DeepSeek Key；订阅群/屏蔽词沿用 genshin 用户推送配置。
# 启用前须将 plugins/genshin/config/mys.pushNews.yaml 的 maxNum 设为 0，防止双发。
newsPush:
  enabled: false
  games: [gs, sr, zzz]
  pollIntervalMs: 30000  # 最少 30 秒；接口仍可能有发布延迟
  sendIntervalMs: 30000  # 同群三个游戏共用间隔，实际发送可更晚
  includePreviews: true # 活动栏目仅补入前瞻/特别节目预告，仍遵守屏蔽词
  maxAgeHours: 2        # 只推最近两小时；首次启用可能补推窗口内未发帖子
  requestTimeoutMs: 10000

# 仅开放服务器功能清单中主人选中的 y 项；新增 JS 安装后需重启。
commandRouting:
  enabled: false
  suggest: true     # 错误指令仅提醒，不执行
  invoke: true      # 点名/@ 或私聊的明确自然语言请求可调用
  loginGuide: true  # 绑定/CK 入口及米游社 Cookie 失效引导扫码登录
  disabledRows: []  # 可按清单编号进一步关闭，例如 [D04, F11]
  cooldownMs: 30000 # 每个用户在同一聊天中的提示/调用分别冷却
  timeoutMs: 30000  # 单次调用等待期限；扫码登录单独为 180 秒

# 开启后仅允许 groups 中的群；空列表禁止所有群，私聊不受影响。
groupWhitelist:
  enabled: false
  groups: []

trigger:
  nicknames: [派蒙, 派大王]
  stripTriggerName: false # 发给api时是否去除nicknames
  privateTrigger: true
  groupMentionTrigger: true
  groupNicknameTrigger: true
  ignoreBotSelf: true
  ignoreCommandPrefixes: ["#", "＃", "*", "%"]

conversation:
  # 群聊中由同一次模型请求判断是否需要回复；关闭时保持原行为，私聊不受影响。
  selectiveGroupReply: false
  # 真正询问无人接话时，至多补一句；独立于主动沉默与长期记忆。
  unansweredFollowUp:
    enabled: false
    waitMs: 30000
    cooldownMs: 180000
  # 开启后称呼优先取群名片，其次 QQ 昵称，再缺失用“旅行者”；关闭则默认称呼“旅行者”。
  useUserNickname: true
  debounceMs: 3000
  activeWindowMs: 90000
  collectAllNonCommandInActiveGroupSession: true
  collectPrivateFollowupWithoutTrigger: true
  maxContextBatches: 6
  # 独立于长期记忆；只保存已触发问答，不延长 90 秒活跃窗口。
  recentContext:
    enabled: false
    retentionMs: 86400000 # 24 小时，开启后搜索缓存也使用这个时长
    persist: true        # 保存到本地文件，日常重启恢复未过期资料
    maxBatches: 20
    maxStoredChars: 16000
    maxPromptChars: 6000
    quotedMessage:
      enabled: true
      maxChars: 4000
  # 点名/@ 时按需查同群同用户的协议历史，不持续缓存未触发消息。
  preTrigger:
    enabled: true
    windowMs: 30000
    maxMessages: 3
    historyPageSize: 20
    historyMaxPages: 3
    historyTimeoutMs: 1500

deepseek:
  apiKey: ""
  apiKeyEnv: DEEPSEEK_API_KEY
  baseUrl: https://api.deepseek.com
  model: deepseek-flash
  timeoutMs: 60000
  maxTokens: 1200
  temperature: 0.8
  maxRetries: 1
  retryDelayMs: 800
  thinking: { type: disabled }
  stream: false

logging:
  enabled: true
  file: data/logs/deepseek.jsonl
  includePrompt: true
  includeResponse: true
  includeUsage: true
  maxBytes: 5242880
  maxFiles: 3

memory:
  enabled: true
  updateMode: session_end_evaluate
  evaluationModel: deepseek-flash
  evaluationMaxTokens: 1600
  evaluationTemperature: 0.2
  userMemoryEnabled: true
  maxParticipantMemoriesForPrompt: 8
  maxMemoryCharsForPrompt: 2500
  maxSessionMessagesForEvaluation: 100
  maxSessionCharsForEvaluation: 12000
  maxStoredMemoryChars: 8000

runtime:
  persistActiveSessions: false
  saveFailedMemoryEvaluations: true
  maxFailedMemoryEvaluationFiles: 20

reply:
  split: true
  guideDelayScale: 0.5 # 攻略问答的首条/分段等待目标倍率；0.1～1，1 恢复普通节奏。
  minDelayMs: 4000
  maxDelayMs: 24000
  baseDelayMs: 1200
  typingMsPerChar: 340
  readingMsPerChar: 360
  delayJitter: 0.1
  # 首条及跨轮消息统一限速；旧 maxTotalDelayMs 已忽略，不再压缩间隔。
  minSegmentLength: 6
  maxSegmentLength: 180
  keepCodeBlockTogether: true
  sendRetries: 1

persona: { file: persona.md }

stickers:
  enabled: true
  mode: contextual # contextual：标注库语境选择；legacy：旧情绪映射
  configFile: stickers.yaml
  probability: 0.12
  sendAfterText: true # 仅 legacy 支持 false；contextual 必须文字全部成功后发送，会提示迁移
  selectionTimeoutMs: 8000 # 语境选图额外一次请求，1～15秒，不重试

knowledge: { enabled: false, provider: none }

# 自动联网：知识库优先，仅为缺失或过时的提瓦特资料搜索。代码更新需重启。
webSearch:
  enabled: false
  apiKey: "" # 搜索/抓取专用 Key；留空沿用 deepseek.apiKey（含聊天环境变量解析结果）。
  maxSearches: 2
  maxFetches: 3
  timeoutMs: 15000
  dailyRequestLimit: 200
  cacheTtlMs: 3600000 # recentContext 开启时由其 retentionMs 覆盖
  maxContextChars: 12000
  includeSources: false

# 仅适配 Linux 本机 Chromium；独立于聊天开关，变更后需重启。
resourceGuard:
  enabled: false
  maxQueue: 20          # 等待中的截图上限；实际同时渲染固定为1
  pageTimeoutMs: 30000
  renderTimeoutMs: 60000
